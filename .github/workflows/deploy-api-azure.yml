name: Deploy API to Azure

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the published image to Azure Container Apps
        required: true
        default: true
        type: boolean
  push:
    branches:
      - master
      - feature/frontend-experience-v1
    paths:
      - "src/CivicFlow.Api/**"
      - "src/CivicFlow.Application/**"
      - "src/CivicFlow.Domain/**"
      - "src/CivicFlow.Infrastructure/**"
      - "deploy/api/**"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/deploy-api-azure.yml"

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/civicflow-api

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: false
      - id: image
        shell: bash
        run: echo "reference=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment: azure-staging
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --image "${{ needs.build-and-publish.outputs.image }}" \
              --only-show-errors
