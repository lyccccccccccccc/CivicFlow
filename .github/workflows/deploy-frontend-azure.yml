name: Deploy frontend to Azure

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/CivicFlow.Client/**"
      - ".github/workflows/deploy-frontend-azure.yml"

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: azure-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/CivicFlow.Client/package-lock.json
      - name: Install and validate
        working-directory: src/CivicFlow.Client
        env:
          VITE_API_URL: ${{ vars.AZURE_API_BASE_URL }}
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src/CivicFlow.Client
          output_location: dist
          skip_app_build: true
